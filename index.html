<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ferreteria frijolito</title>
    <style>
        :root {
            --naranja: #e67e22;
            --naranja-oscuro: #cf6d17;
            --gris: #2f3640;
            --fondo: #f8f9fa;
            --borde: #dcdde1;
            --blanco: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--fondo);
            color: var(--gris);
        }
        header {
            background: var(--gris);
            color: #fff;
            padding: 30px 16px;
            text-align: center;
        }
        header h1 { margin: 0 0 6px; font-size: 2rem; }
        header p { margin: 0; opacity: .85; }
        .admin-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--naranja);
            text-decoration: none;
            font-weight: 600;
        }
        .admin-link:hover { text-decoration: underline; }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 16px;
            display: grid;
            gap: 30px;
            grid-template-columns: 1fr;
        }
        @media (min-width: 850px) {
            main { grid-template-columns: 2.2fr 1fr; align-items: start; }
        }
        h2 { margin-top: 0; font-size: 1.4rem; border-bottom: 2px solid var(--borde); padding-bottom: 8px; }
        .productos {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }
        .producto, .carrito {
            background: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .producto { display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .producto .icono-prod { font-size: 3rem; margin-bottom: 5px; }
        .producto h3 { margin: 0; font-size: 1.1rem; }
        .precio { font-size: 1.35rem; font-weight: 700; color: var(--naranja-oscuro); margin: 0; }
        button {
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: .95rem;
            font-weight: 600;
            background: var(--naranja);
            color: #fff;
            transition: background .15s;
        }
        button:hover:not(:disabled) { background: var(--naranja-oscuro); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button.secundario { background: #f1f2f6; color: var(--gris); border: 1px solid var(--borde); }
        button.secundario:hover:not(:disabled) { background: #dfe4ea; }
        .producto button { margin-top: auto; width: 100%; }
        .carrito { position: sticky; top: 20px; }
        .carrito ul { list-style: none; margin: 0 0 16px; padding: 0; max-height: 300px; overflow-y: auto; }
        .carrito li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--borde); font-size: .95rem; }
        .carrito li .nombre { flex: 1; }
        .carrito li button { padding: 4px 10px; font-size: .8rem; width: auto; }
        .vacio { color: #888; font-style: italic; text-align: center; padding: 15px 0; }
        .total { font-size: 1.25rem; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
        .carrito .acciones { display: flex; gap: 10px; }
        .carrito .acciones button:first-child { flex: 2; }
        .carrito .acciones button:last-child { flex: 1; }
        .overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000;
        }
        .overlay.abierto { display: flex; }
        .modal { background: var(--blanco); border-radius: 14px; padding: 30px; width: 100%; max-width: 450px; }
        .modal label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 0.9rem; }
        .modal input { width: 100%; padding: 12px; border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem; }
        .modal .acciones-modal { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
        #mensaje {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--gris); color: #fff; padding: 14px 24px; border-radius: 10px;
            transition: transform 0.3s ease; z-index: 1100; max-width: 90%; text-align: center;
        }
        #mensaje.error { background: #e74c3c; }
        #mensaje.visible { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <header>
        <h1>🔧 Ferretería "El Tornillo"</h1>
        <p>Herramientas de calidad directo a tu hogar</p>
        <a href="admin.html" class="admin-link">altas y bajas</a>
    </header>

    <main>
        <section>
            <h2>Catálogo de Productos</h2>
            <div class="productos" id="lista-productos">
                <p class="vacio">Cargando productos...</p>
            </div>
        </section>

        <aside class="carrito">
            <h2>🛒 Tu Carrito (<span id="cant-carrito">0</span>)</h2>
            <ul id="lista-carrito"><li class="vacio">Tu carrito está vacío</li></ul>
            <div class="total"><span>Total:</span> <b id="total-carrito">$0.00</b></div>
            <div class="acciones">
                <button id="btn-comprar" onclick="abrirRegistro()" disabled>Comprar ahora</button>
                <button class="secundario" onclick="vaciarCarrito()">Vaciar</button>
            </div>
        </aside>
    </main>

    <div class="overlay" id="modal-registro">
        <form class="modal" id="form-registro">
            <h2>Finalizar Pedido</h2>
            <label>Nombre completo</label>
            <input type="text" id="nombre-cliente" required>
            <label>Dirección de entrega</label>
            <input type="text" id="direccion-cliente" required>
            <label>Teléfono de contacto</label>
            <input type="tel" id="telefono-cliente" required>
            <div class="acciones-modal">
                <button type="button" class="secundario" onclick="cerrarRegistro()">Cancelar</button>
                <button type="submit" id="btn-confirmar">Confirmar pedido</button>
            </div>
        </form>
    </div>

    <div id="mensaje"></div>

    <script>
        const dinero = n => '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2 });
        const $ = id => document.getElementById(id);
        let carrito = [];

        function mostrarMensaje(texto, esError = false) {
            const m = $('mensaje');
            m.textContent = texto;
            m.className = 'visible' + (esError ? ' error' : '');
            setTimeout(() => m.className = '', 4000);
        }

        async function cargarProductos() {
            const cont = $('lista-productos');
            try {
                const resp = await fetch('productos.php');
                const productos = await resp.json();
                cont.innerHTML = '';
                if (productos.length === 0) {
                    cont.innerHTML = '<p class="vacio">No hay productos disponibles.</p>';
                    return;
                }
                productos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'producto';
                    card.innerHTML = `
                        <div class="icono-prod">🛠️</div>
                        <h3>${p.nombre}</h3>
                        <p class="precio">${dinero(p.precio)}</p>
                    `;
                    const btn = document.createElement('button');
                    btn.textContent = 'Agregar al carrito';
                    btn.onclick = () => agregar(p.id, p.nombre, Number(p.precio));
                    card.appendChild(btn);
                    cont.appendChild(card);
                });
            } catch (err) {
                cont.innerHTML = '<p class="vacio" style="color:red;">Error al cargar productos.</p>';
            }
        }

        function actualizarCarritoUI() {
            const total = carrito.reduce((s, p) => s + (p.precio * p.cantidad), 0);
            const cantTotal = carrito.reduce((s, p) => s + p.cantidad, 0);
            $('cant-carrito').textContent = cantTotal;
            $('total-carrito').textContent = dinero(total);
            const ul = $('lista-carrito');
            ul.innerHTML = '';

            if (carrito.length === 0) {
                ul.innerHTML = '<li class="vacio">Tu carrito está vacío</li>';
                $('btn-comprar').disabled = true;
                return;
            }

            carrito.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="nombre">${item.cantidad}x ${item.nombre}</span> <span>${dinero(item.precio * item.cantidad)}</span>`;
                const btnQuitar = document.createElement('button');
                btnQuitar.className = 'secundario';
                btnQuitar.textContent = '−';
                btnQuitar.onclick = () => {
                    item.cantidad--;
                    if (item.cantidad <= 0) carrito = carrito.filter(p => p.id !== item.id);
                    actualizarCarritoUI();
                };
                li.appendChild(btnQuitar);
                ul.appendChild(li);
            });
            $('btn-comprar').disabled = false;
        }

        function agregar(id, nombre, precio) {
            const ex = carrito.find(p => p.id === id);
            if (ex) ex.cantidad++;
            else carrito.push({ id, nombre, precio, cantidad: 1 });
            actualizarCarritoUI();
            mostrarMensaje(`Agregado: ${nombre}`);
        }

        function vaciarCarrito() {
            carrito = [];
            actualizarCarritoUI();
            mostrarMensaje('Carrito vaciado');
        }

        function abrirRegistro() { $('modal-registro').classList.add('abierto'); }
        function cerrarRegistro() { $('modal-registro').classList.remove('abierto'); }

        $('form-registro').onsubmit = async e => {
            e.preventDefault();
            const nombre = $('nombre-cliente').value.trim();
            const direccion = $('direccion-cliente').value.trim();
            const telefono = $('telefono-cliente').value.trim();

            if (!nombre || !direccion || !telefono) {
                mostrarMensaje('Completa todos los campos', true);
                return;
            }

            try {
                const resp = await fetch('pedidos.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, direccion, telefono, items: carrito })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error);

                mostrarMensaje(`¡Pedido #${data.pedidoId} registrado con éxito!`);
                carrito = [];
                actualizarCarritoUI();
                $('form-registro').reset();
                cervrarRegistro();
            } catch (err) {
                mostrarMensaje('Error: ' + err.message, true);
            }
        };

        cargarProductos();
    </script>
</body>
</html>
